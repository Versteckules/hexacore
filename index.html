		<!-- START: Canvas Hack (Für In-Game-Texte & Titel-Skalierung) -->
		<script>
			(function() {
				function translateText(text) {
					if (text === undefined || text === null) return text;
					var str = String(text);
					
					if (/Hextris/i.test(str)) return str.replace(/Hextris/ig, 'Hexacore');
					if (/^Play!$/i.test(str)) return 'Start!';
					if (/Match 3\+/i.test(str)) return 'Kombiniere 3+ Blöcke!';
					if (/Use the right and left/i.test(str) || /Tap the left and right/i.test(str)) return 'Tippe links oder rechts,';
					if (/to rotate the hexagon/i.test(str) || /sides of the screen/i.test(str)) return 'um das Sechseck zu drehen.';
					
					return str;
				}

				var originalStrokeText = CanvasRenderingContext2D.prototype.strokeText;
				CanvasRenderingContext2D.prototype.strokeText = function() {
					var args = Array.prototype.slice.call(arguments);
					if (args.length > 0) args[0] = translateText(args[0]);
					return originalStrokeText.apply(this, args);
				};

				var originalMeasureText = CanvasRenderingContext2D.prototype.measureText;
				CanvasRenderingContext2D.prototype.measureText = function() {
					var args = Array.prototype.slice.call(arguments);
					if (args.length > 0) args[0] = translateText(args[0]);
					return originalMeasureText.apply(this, args);
				};

				var originalFillText = CanvasRenderingContext2D.prototype.fillText;
				CanvasRenderingContext2D.prototype.fillText = function() {
					var args = Array.prototype.slice.call(arguments);
					if (args.length > 0) {
						args[0] = translateText(args[0]);
						if (args[0] === 'Hexacore') {
							this.save();
							this.translate(args[1], args[2]);
							this.scale(0.85, 0.85); // Staucht den Titel etwas
							var res = originalFillText.call(this, args[0], 0, 0, args[3]);
							this.restore();
							return res;
						}
					}
					return originalFillText.apply(this, args);
				};
			})();
		</script>
		<!-- ENDE: Canvas Hack -->

		<!-- START: Geocaching UI Steuerung & Code-Entschlüsselung -->
		<script type="text/javascript">
			setInterval(function() {
				var customAvatar = document.getElementById('custom-avatar');
				var inGameHint = document.getElementById('geocaching-hint');
				var highScoreText = document.getElementById('highScoreInGameText');
				var highScoreHeader = document.getElementById('HIGHSCORE');

				// Sichere Steuerung über die interne gameState-Variable von Hextris
				if (typeof gameState !== 'undefined') {
					if (gameState === 0) {
						// Menü
						if (customAvatar) customAvatar.style.display = 'block';
						if (inGameHint) inGameHint.style.display = 'none';
						if (highScoreText) highScoreText.style.visibility = 'hidden';
						if (highScoreHeader) highScoreHeader.style.visibility = 'hidden';
					} else if (gameState === 1 || gameState === 3) {
						// Spiel läuft oder Pause
						if (customAvatar) customAvatar.style.display = 'none';
						if (inGameHint) inGameHint.style.display = 'block';
						if (highScoreText) {
							highScoreText.style.visibility = '';
							highScoreText.style.opacity = '1';
						}
						if (highScoreHeader) {
							highScoreHeader.style.visibility = '';
							highScoreHeader.style.opacity = '1';
						}
					} else {
						// Game Over
						if (customAvatar) customAvatar.style.display = 'none';
						if (inGameHint) inGameHint.style.display = 'none';
						if (highScoreText) highScoreText.style.opacity = '0';
						if (highScoreHeader) highScoreHeader.style.opacity = '0';
					}
				}

				// Koordinaten entschlüsseln
				if (typeof score !== 'undefined' && score >= 2500) {
					if (!window.cacheKnacked) {
						window.cacheKnacked = true;
						
						// HIER DEINEN BASE64 CODE EINTRAGEN!
						var secretBase64 = "TiA1MSAxMi4zNDUgRSAwMDkgNTYuNzg5";
						
						alert("Glückwunsch! Du hast den Cache geknackt. Die Koordinaten sind: " + atob(secretBase64));
					}
				}
			}, 200);
		</script>
		<!-- ENDE: Geocaching UI Steuerung & Code-Entschlüsselung -->
