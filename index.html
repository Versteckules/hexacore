		<!-- START: Canvas Hack (Für In-Game-Texte & Titel-Skalierung) -->
		<script>
			(function() {
				function translateText(text) {
					if (text === undefined || text === null) return text;
					var str = String(text);
					
					if (/Hextris/i.test(str)) return str.replace(/Hextris/ig, 'Hexacore');
					if (/^Play!$/i.test(str)) return 'Start!';
					if (/Match 3\+/i.test(str)) return 'Kombiniere 3+ Blöcke!';
					if (/Use the right and left/i.test(str) || /Tap the screen's left and right/i.test(str)) return 'Tippe links oder rechts,';
					if (/to rotate the hexagon/i.test(str) || /sides of the screen/i.test(str)) return 'um das Sechseck zu drehen.';
					
					return str;
				}

				var originalStrokeText = CanvasRenderingContext2D.prototype.strokeText;
				CanvasRenderingContext2D.prototype.strokeText = function() {
					var args = Array.prototype.slice.call(arguments);
					if (args.length > 0) args[0] = translateText(args[0]);
					return originalStrokeText.apply(this, args);
				};

				var originalMeasureText = CanvasRenderingContext2D.prototype.measureText;
				CanvasRenderingContext2D.prototype.measureText = function() {
					var args = Array.prototype.slice.call(arguments);
					if (args.length > 0) args[0] = translateText(args[0]);
					return originalMeasureText.apply(this, args);
				};

				var originalFillText = CanvasRenderingContext2D.prototype.fillText;
				CanvasRenderingContext2D.prototype.fillText = function() {
					var args = Array.prototype.slice.call(arguments);
					if (args.length > 0) {
						args[0] = translateText(args[0]);
						if (args[0] === 'Hexacore') {
							this.save();
							this.translate(args[1], args[2]);
							this.scale(0.85, 0.85); // Staucht den Titel etwas
							var res = originalFillText.call(this, args[0], 0, 0, args[3]);
							this.restore();
							return res;
						}
					}
					return originalFillText.apply(this, args);
				};
			})();
		</script>
		<!-- ENDE: Canvas Hack -->

	<body>
		<canvas id="canvas"></canvas>
		<div id="overlay" class="faded overlay"></div>
		
		<!-- START: Geocaching Avatar (8% Deckkraft) -->
		<div id="custom-avatar" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 50; text-align: center; pointer-events: none; display: none; opacity: 0.08;">

		<!-- START: In-Game Hinweis für Geocacher (Jetzt 3000 Punkte) -->
		<div id="geocaching-hint" style="position: absolute; top: 15%; left: 50%; transform: translateX(-50%); z-index: 10000; text-align: center; color: #fff; font-family: 'Exo 2', sans-serif; font-size: 15px; font-weight: bold; background: rgba(231, 76, 60, 0.95); border: 2px solid #c0392b; padding: 6px 15px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; display: none; white-space: nowrap;">
			ZIEL: 2500 PUNKTE FÜR KOORDINATEN
		</div>

		<!-- START: Vollbild Geocaching-Sieger-Popup -->
		<div id="victory-popup" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(20, 25, 30, 0.95); z-index: 2147483647; flex-direction: column; justify-content: center; align-items: center; text-align: center; font-family: 'Exo 2', sans-serif;">
			<div style="background: rgba(0,0,0,0.6); padding: 40px 20px; border-radius: 20px; border: 2px solid #2ecc71; box-shadow: 0 0 40px rgba(46, 204, 113, 0.4); width: 85%; max-width: 400px;">
				<h1 style="color: #2ecc71; font-size: 32px; font-weight: 900; margin: 0 0 15px 0; text-shadow: 0 0 15px #2ecc71; letter-spacing: 1px;">SYSTEM GEKNACKT</h1>
				<p style="color: #ecf0f1; font-size: 18px; margin-bottom: 25px;">Glückwunsch! Hier sind die Final-Koordinaten:</p>
				<div style="background: #111; padding: 15px; border-radius: 10px; border: 1px solid #e74c3c; box-shadow: inset 0 0 10px rgba(231, 76, 60, 0.3);">
					<span id="secret-coords" style="color: #e74c3c; font-family: monospace; font-size: 22px; font-weight: bold; letter-spacing: 1px;"></span>
				</div>
				<p style="color: #95a5a6; font-size: 14px; margin-top: 20px; margin-bottom: 30px;">(Am besten sofort einen Screenshot machen!)</p>
				<button onclick="document.getElementById('victory-popup').style.display='none';" style="background: #2ecc71; color: #111; border: none; padding: 12px 30px; font-size: 18px; font-weight: bold; border-radius: 25px; cursor: pointer; box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4); text-transform: uppercase;">Weiter spielen</button>
			</div>
		</div>

		</div>
		
		<div id="gameoverscreen">

				<div class='score'><span class='scoreNum'>2.</span> <div id="2place" style="display:inline;">0</div></div>
				<div class='score'><span class='scoreNum'>3.</span> <div id="3place" style="display:inline;">0</div></div>
			</div>

				<div id='socialShare'>

		</div>

		<!-- START: Geocaching UI Steuerung & Code-Entschlüsselung -->
		<script type="text/javascript">
			setInterval(function() {
				var customAvatar = document.getElementById('custom-avatar');
				var inGameHint = document.getElementById('geocaching-hint');
				var highScoreText = document.getElementById('highScoreInGameText');
				var highScoreHeader = document.getElementById('HIGHSCORE');

				// Sichere Steuerung über die interne gameState-Variable von Hextris
				if (typeof gameState !== 'undefined') {
					if (gameState === 0) {
						// Menü
						if (customAvatar) customAvatar.style.display = 'block';
						if (inGameHint) inGameHint.style.display = 'none';
						if (highScoreText) highScoreText.style.visibility = 'hidden';
						if (highScoreHeader) highScoreHeader.style.visibility = 'hidden';
					} else if (gameState === 1 || gameState === 3) {
						// Spiel läuft oder Pause
						if (customAvatar) customAvatar.style.display = 'none';
						if (inGameHint) inGameHint.style.display = 'block';
						if (highScoreText) {
							highScoreText.style.visibility = '';
							highScoreText.style.opacity = '1';
						}
						if (highScoreHeader) {
							highScoreHeader.style.visibility = '';
							highScoreHeader.style.opacity = '1';
						}
					} else {
						// Game Over
						if (customAvatar) customAvatar.style.display = 'none';
						if (inGameHint) inGameHint.style.display = 'none';
						if (highScoreText) highScoreText.style.opacity = '0';
						if (highScoreHeader) highScoreHeader.style.opacity = '0';
					}
				}

				if (typeof score !== 'undefined' && score >= 2500) {
					if (!window.cacheKnacked) {
						window.cacheKnacked = true;
						
						var secretBase64 = "TiA1MCAxNy42MDUgRSAwMTIgMDAuMTQ2";
						
						document.getElementById('secret-coords').innerText = atob(secretBase64);
						document.getElementById('victory-popup').style.display = 'flex';
					}
				}
			}, 200);
		</script>
		<!-- ENDE: Geocaching UI Steuerung & Code-Entschlüsselung -->
	</body>
