<!DOCTYPE html>
<html lang='de'>
	<head>
		<title>Hexacore</title>
		<meta name="description" content="Ein Geocaching Puzzle.">
		<link rel="manifest" href="manifest.webmanifest">
		<meta name="apple-itunes-app" content="app-id=903769553"/>

		<!-- START: Social Media verstecken -->
		<style>
			#socialShare, #buttonCont, #badges {
				display: none !important;
			}
			/* Macht die Anleitung etwas ansehnlicher */
			#inst_main_body p {
				font-size: 16px;
				line-height: 1.5;
				margin-bottom: 15px;
			}
		</style>
		<!-- ENDE -->

		<!-- START: Canvas Hack (Übersetzt alle live gezeichneten Texte ins Deutsche) -->
		<script>
			var originalFillText = CanvasRenderingContext2D.prototype.fillText;
			CanvasRenderingContext2D.prototype.fillText = function(text, x, y, maxWidth) {
				if (text === 'Hextris') text = 'Hexacore';
				else if (text === 'Game Paused') text = 'Spiel pausiert';
				else if (text === 'Use the right and left arrow keys') text = 'Tippe links oder rechts,';
				else if (text === 'to rotate the hexagon.') text = 'um das Sechseck zu drehen.';
				else if (text === 'Match 3+ blocks to score!') text = 'Kombiniere 3+ Blöcke!';
				else if (text === 'Play!') text = 'Start!';
				// Blendet die Entwickler-Werbung im Pausenmenü aus
				else if (text === 'Want to support the developers? Click here to') text = '';
				else if (text === 'buy one of the ad-free mobile versions!') text = '';
				
				return originalFillText.apply(this, arguments);
			};
		</script>
		<!-- ENDE: Canvas Hack -->

		<link rel="icon" type="image/png" href="favicon.ico">
		<link href='http://fonts.googleapis.com/css?family=Exo+2' rel='stylesheet' type='text/css'>
		<link rel="stylesheet" href="style/fa/css/font-awesome.min.css">
		<link rel="stylesheet" type="text/css" href="style/style.css">
		<script type='text/javascript' src="vendor/hammer.min.js"></script>
		<script type='text/javascript' src="vendor/js.cookie.js"></script>
		<script type='text/javascript' src="vendor/jsonfn.min.js"></script>
		<script type='text/javascript' src="vendor/keypress.min.js"></script>
		<script type='text/javascript' src="vendor/jquery.js"></script>
		<script type='text/javascript' src="js/save-state.js"></script>
		<script type='text/javascript' src="js/view.js"></script>
		<script type='text/javascript' src="js/wavegen.js"></script>
		<script type='text/javascript' src="js/math.js"></script>
		<script type='text/javascript' src="js/Block.js"></script>
		<script type='text/javascript' src="js/Hex.js"></script>
		<script type='text/javascript' src="js/Text.js"></script>
		<script type='text/javascript' src="js/comboTimer.js"></script>
		<script type='text/javascript' src="js/checking.js"></script>
		<script type='text/javascript' src='js/update.js'></script>
		<script type='text/javascript' src='js/render.js'></script>
		<script type='text/javascript' src="js/input.js"></script>
		<script type='text/javascript' src="js/main.js"></script>
		<script type='text/javascript' src="js/initialization.js"></script>
		<script src="vendor/sweet-alert.min.js"></script>
		<link rel="stylesheet" href="style/rrssb.css"/>
	</head>
	<body>
		<canvas id="canvas"></canvas>
		<div id="overlay" class="faded overlay"></div>
		
		<!-- START: Geocaching Avatar (als großes, subtiles Hintergrundbild) -->
		<div id="custom-avatar" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 50; text-align: center; pointer-events: none; display: none; opacity: 0.2;">
			<img src="images/Avatar.jpg" alt="Avatar" style="height: 60vh; max-width: 80vw; object-fit: contain; border-radius: 15px;">
		</div>
		<!-- ENDE: Geocaching Avatar -->

		<div id='startBtn' ></div>
		<div id="helpScreen" class='unselectable'>
			<div id='inst_main_body'></div>
		</div>
		<img id="openSideBar" class='helpText' src="./images/btn_help.svg"/>
		<div class="faded overlay"></div>
		<img id="pauseBtn" src="./images/btn_pause.svg"/>
		<img id='restartBtn' src="./images/btn_restart.svg"/>
		
		<!-- Statische Texte auf Deutsch übersetzt -->
		<div id='HIGHSCORE'>HIGHSCORE</div>
		
		<div id='highScoreInGameText'>
			<div id='highScoreInGameTextHeader'>HIGHSCORE</div><div id='currentHighScore'>0</div>
		</div>
		
		<div id="gameoverscreen">
			<div id='container'>
				<div id='gameOverBox' class='GOTitle'>SPIEL VORBEI</div>
				<div id='cScore'>0</div>
				<div id='highScoresTitle' class='GOTitle'>BESTENLISTE</div>
				<div class='score'><span class='scoreNum'>1.</span> <div id="1place" style="display:inline;">0</div></div>
				<div class='score'><span class='scoreNum'>2.</span> <div id="2place" style="display:inline;">0</div></div>
				<div class='score'><span class='scoreNum'>3.</span> <div id="3place" style="display:inline;">0</div></div>
			</div>
			<div id='bottomContainer'>
				<img id='restart' src='./images/btn_restart.svg' height='57px'>
				
				<!-- Social Buttons unsichtbar im Code behalten, damit keine Fehler entstehen -->
				<div id='socialShare'>
					<svg width="224.6377px" height="57px"  viewBox="0 0 255 65" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
						<g id="Page-1" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
							<g id="Game-over-" transform="translate(-95.000000, -565.000000)">
								<g id="Share-button" transform="translate(95.000000, 565.000000)">
								<a style="cursor:pointer;" class="popup"><polygon fill="#3498DB" transform="translate(127.661316, 32.500000) rotate(-90.000000) translate(-127.661316, -32.500000) " points="127.661316 -94.814636 160.137269 -76.064636 160.137269 141.064636 127.661317 159.814636 95.185364 141.064636 95.1853635 -76.064636 "></polygon></a>
									<text style="cursor:pointer;" class="popup" font-family="Exo" font-size="16" font-weight="420" fill="#FFFFFF">
										<tspan x="67" y="39">TEILEN</tspan>
									</text>
								</g>
							</g>
						</g>
					</svg>
				</div>
				<div id='buttonCont'>
					<ul class="rrssb-buttons">
						<li class="rrssb-facebook"><a href='#' class="popup"></a></li>
						<li class="rrssb-twitter"><a href="#" class="popup"></a></li>
					</ul>
					<div id='badges'></div>
				</div>
			</div>
		</div>
		<script type="text/javascript" src='vendor/rrssb.min.js'></script>
		
		<!-- START: Geocaching UI & Base64 Hack -->
		<script type="text/javascript">
			setInterval(function() {
				// 1. UI Elemente kontrollieren (Avatar & Highscore umschalten)
				var startBtn = document.getElementById('startBtn');
				var customAvatar = document.getElementById('custom-avatar');
				var highScoreText = document.getElementById('highScoreInGameText');
				var highScoreHeader = document.getElementById('HIGHSCORE');
				var helpBody = document.getElementById('inst_main_body');

				if (startBtn && window.getComputedStyle(startBtn).display !== 'none') {
					// STARTMENÜ: Avatar zeigen, Highscore verstecken
					if (customAvatar) customAvatar.style.display = 'block';
					if (highScoreText) highScoreText.style.visibility = 'hidden';
					if (highScoreHeader) highScoreHeader.style.visibility = 'hidden';
				} else {
					// IM SPIEL: Avatar verstecken, Highscore zeigen
					if (customAvatar) customAvatar.style.display = 'none';
					if (highScoreText) highScoreText.style.visibility = '';
					if (highScoreHeader) highScoreHeader.style.visibility = '';
				}

				// 2. Hilfe-Menü komplett auf Deutsch überschreiben
				if (helpBody && helpBody.innerHTML.includes('HOW TO PLAY')) {
					helpBody.innerHTML = `
						<h2 style="text-align: center; font-family: 'Exo 2', sans-serif; font-size: 24px; margin-bottom: 15px;">SPIELANLEITUNG</h2>
						<p>Das Ziel von <strong>Hexacore</strong> ist es zu verhindern, dass die Blöcke das äußere graue Sechseck verlassen.</p>
						<p>Tippe auf die linke oder rechte Bildschirmhälfte, um das Sechseck zu drehen.</p>
						<p>Sammle Punkte, indem du 3 oder mehr Blöcke der gleichen Farbe berühren lässt.</p>
						<div style="text-align: center; color: #e74c3c; font-weight: bold; font-size: 18px; margin-top: 25px; background: rgba(255,255,255,0.9); padding: 15px; border-radius: 8px; border: 2px solid #e74c3c;">
							GEOCACHING HINWEIS:<br>Erreiche 2500 Punkte, um die Final-Koordinaten zu entschlüsseln!
						</div>
					`;
				}

				// 3. Geocaching Koordinaten einblenden (bei 2500 Punkten)
				if (typeof score !== 'undefined' && score >= 2500) {
					if (!window.cacheKnacked) {
						window.cacheKnacked = true;
						
						// Hier deinen Base64-String einfügen!
						var secretBase64 = "TiA1MSAxMi4zNDUgRSAwMDkgNTYuNzg5";
						
						alert("Glückwunsch! Du hast den Cache geknackt. Die Koordinaten sind: " + atob(secretBase64));
					}
				}
			}, 200);
		</script>
		<!-- ENDE: Geocaching UI & Base64 Hack -->
	</body>
</html>
