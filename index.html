		<!-- START: Kugelsicherer Canvas Hack für Mobile Browser -->
		<script>
			(function() {
				function translateText(text) {
					if (text === undefined || text === null) return text;
					var str = String(text);
					
					// Ersetzt Titel & Buttons
					if (/Hextris/i.test(str)) return str.replace(/Hextris/ig, 'Hexacore');
					if (/^Play!$/i.test(str)) return 'Start!';
					if (/Match 3\+/i.test(str)) return 'Kombiniere 3+ Blöcke!';
					if (/Game Paused/i.test(str)) return 'Spiel pausiert';
					
					// Erkennt PC & Mobile Tutorial-Texte
					if (/Use the right and left/i.test(str) || /Tap the left and right/i.test(str)) return 'Tippe links oder rechts,';
					if (/to rotate the hexagon/i.test(str) || /sides of the screen/i.test(str)) return 'um das Sechseck zu drehen.';
					
					// Tötet die Entwickler-Werbung
					if (/Want to support/i.test(str) || /buy one of the/i.test(str)) return '';
					
					return str;
				}

				// Überschreibt strokeText (Mobile-sicher mit echtem Array)
				var originalStrokeText = CanvasRenderingContext2D.prototype.strokeText;
				CanvasRenderingContext2D.prototype.strokeText = function() {
					var args = Array.prototype.slice.call(arguments);
					if (args.length > 0) args[0] = translateText(args[0]);
					return originalStrokeText.apply(this, args);
				};

				// Überschreibt measureText (entfernt die Unterstriche der Werbung)
				var originalMeasureText = CanvasRenderingContext2D.prototype.measureText;
				CanvasRenderingContext2D.prototype.measureText = function() {
					var args = Array.prototype.slice.call(arguments);
					if (args.length > 0) args[0] = translateText(args[0]);
					
					if (args[0] === '') return { width: 0 };
					return originalMeasureText.apply(this, args);
				};

				// Überschreibt fillText (inkl. 15% Skalierung für "Hexacore")
				var originalFillText = CanvasRenderingContext2D.prototype.fillText;
				CanvasRenderingContext2D.prototype.fillText = function() {
					var args = Array.prototype.slice.call(arguments);
					if (args.length > 0) {
						args[0] = translateText(args[0]);
						
						if (args[0] === 'Hexacore') {
							this.save();
							this.translate(args[1], args[2]);
							this.scale(0.85, 0.85);
							var res = originalFillText.call(this, args[0], 0, 0, args[3]);
							this.restore();
							return res;
						}
					}
					return originalFillText.apply(this, args);
				};
			})();
		</script>

		<!-- START: Geocaching UI Steuerung -->
		<script type="text/javascript">
			setInterval(function() {
				// Übersetzt eventuelle HTML-Reste sicherheitshalber mit
				var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
				var node;
				while (node = walker.nextNode()) {
					if (node.nodeValue.indexOf('Game Paused') > -1) {
						node.nodeValue = node.nodeValue.replace('Game Paused', 'Spiel pausiert');
					}
					if (node.nodeValue.indexOf('Want to support') > -1 || node.nodeValue.indexOf('buy one of the') > -1) {
						node.nodeValue = '';
						if (node.parentElement && node.parentElement.tagName === 'A') {
							node.parentElement.style.display = 'none';
						}
					}
				}

				// UI Steuerung
				var startBtn = document.getElementById('startBtn');
				var gameOverScreen = document.getElementById('gameoverscreen');
				var customAvatar = document.getElementById('custom-avatar');
				var inGameHint = document.getElementById('geocaching-hint');
				var highScoreText = document.getElementById('highScoreInGameText');
				var highScoreHeader = document.getElementById('HIGHSCORE');
				var helpBody = document.getElementById('inst_main_body');

				var isMenu = startBtn && window.getComputedStyle(startBtn).display !== 'none';
				var isGameOver = gameOverScreen && window.getComputedStyle(gameOverScreen).display !== 'none';

				// Blendet den Game Over Screen sauber ein und den laufenden Score aus
				if (isGameOver) {
					if (highScoreText) highScoreText.style.opacity = '0';
					if (highScoreHeader) highScoreHeader.style.opacity = '0';
					if (customAvatar) customAvatar.style.display = 'none';
					if (inGameHint) inGameHint.style.display = 'none';
				} 
				// Menü
				else if (isMenu) {
					if (customAvatar) customAvatar.style.display = 'block';
					if (inGameHint) inGameHint.style.display = 'none';
					if (highScoreText) {
						highScoreText.style.visibility = 'hidden';
						highScoreText.style.opacity = '1'; 
					}
					if (highScoreHeader) {
						highScoreHeader.style.visibility = 'hidden';
						highScoreHeader.style.opacity = '1';
					}
				} 
				// Im Spiel oder Pause
				else {
					if (customAvatar) customAvatar.style.display = 'none';
					if (inGameHint) inGameHint.style.display = 'block';
					if (highScoreText) {
						highScoreText.style.visibility = '';
						highScoreText.style.opacity = '1';
					}
					if (highScoreHeader) {
						highScoreHeader.style.visibility = '';
						highScoreHeader.style.opacity = '1';
					}
				}

				// Hilfe-Menü
				if (helpBody && helpBody.innerHTML.includes('HOW TO PLAY')) {
					helpBody.innerHTML = `
						<h2 style="text-align: center; font-family: 'Exo 2', sans-serif; font-size: 24px; margin-bottom: 15px;">SPIELANLEITUNG</h2>
						<p>Das Ziel von <strong>Hexacore</strong> ist es zu verhindern, dass die Blöcke das äußere graue Sechseck verlassen.</p>
						<p>Tippe auf die linke oder rechte Bildschirmhälfte, um das Sechseck zu drehen.</p>
						<p>Sammle Punkte, indem du 3 oder mehr Blöcke der gleichen Farbe berühren lässt.</p>
						<div style="text-align: center; color: #e74c3c; font-weight: bold; font-size: 18px; margin-top: 25px; background: rgba(255,255,255,0.9); padding: 15px; border-radius: 8px; border: 2px solid #e74c3c;">
							GEOCACHING HINWEIS:<br>Erreiche 2500 Punkte, um die Final-Koordinaten zu entschlüsseln!
						</div>
					`;
				}

				// Koordinaten Check
				if (typeof score !== 'undefined' && score >= 2500) {
					if (!window.cacheKnacked) {
						window.cacheKnacked = true;
						var secretBase64 = "TiA1MSAxMi4zNDUgRSAwMDkgNTYuNzg5"; // <-- DEIN BASE64 CODE HIER
						alert("Glückwunsch! Du hast den Cache geknackt. Die Koordinaten sind: " + atob(secretBase64));
					}
				}
			}, 200);
		</script>
