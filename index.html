		<!-- START: Kugelsicherer Canvas Hack (Übersetzt das Spiel & fixt Titel-Breite) -->
		<script>
			(function() {
				function translateText(text) {
					if (text === undefined || text === null) return text;
					var str = String(text);
					
					if (/Hextris/i.test(str)) return str.replace(/Hextris/ig, 'Hexacore');
					if (/Game Paused/i.test(str)) return 'Spiel pausiert';
					if (/Use the right and left/i.test(str)) return 'Tippe links oder rechts,';
					if (/to rotate the hexagon/i.test(str)) return 'um das Sechseck zu drehen.';
					if (/Match 3\+/i.test(str)) return 'Kombiniere 3+ Blöcke!';
					if (/^Play!$/i.test(str)) return 'Start!';
					
					if (/Want to support/i.test(str)) return '';
					if (/buy one of the/i.test(str)) return '';
					
					return str;
				}

				// Überschreibt strokeText und measureText
				var methods = ['strokeText', 'measureText'];
				methods.forEach(function(method) {
					var original = CanvasRenderingContext2D.prototype[method];
					CanvasRenderingContext2D.prototype[method] = function() {
						if (arguments.length > 0) {
							arguments[0] = translateText(arguments[0]);
						}
						return original.apply(this, arguments);
					};
				});

				// Spezielle Logik für fillText, um das "Hexacore"-Wort auf dem Handy zu stauchen
				var originalFillText = CanvasRenderingContext2D.prototype.fillText;
				CanvasRenderingContext2D.prototype.fillText = function(text, x, y, maxWidth) {
					var translated = translateText(text);
					
					// Wenn Hexacore gezeichnet wird, zwingen wir es auf max. 90% der Bildschirmbreite
					if (translated === 'Hexacore' && this.canvas) {
						var maxW = this.canvas.width * 0.9;
						return originalFillText.call(this, translated, x, y, maxW);
					}
					
					if (maxWidth !== undefined) return originalFillText.call(this, translated, x, y, maxWidth);
					return originalFillText.call(this, translated, x, y);
				};
			})();
		</script>
		<!-- ENDE: Canvas Hack -->

		<!-- START: Geocaching UI Steuerung & Code-Entschlüsselung -->
		<script type="text/javascript">
			setInterval(function() {
				var customAvatar = document.getElementById('custom-avatar');
				var inGameHint = document.getElementById('geocaching-hint');
				var highScoreText = document.getElementById('highScoreInGameText');
				var highScoreHeader = document.getElementById('HIGHSCORE');
				var helpBody = document.getElementById('inst_main_body');

				// Sichere Steuerung über die interne gameState-Variable von Hextris
				// 0 = Menü, 1 = Im Spiel, 2 = Game Over, 3 = Pause
				if (typeof gameState !== 'undefined') {
					if (gameState === 0) {
						if (customAvatar) customAvatar.style.display = 'block';
						if (inGameHint) inGameHint.style.display = 'none';
						if (highScoreText) highScoreText.style.visibility = 'hidden';
						if (highScoreHeader) highScoreHeader.style.visibility = 'hidden';
					} else if (gameState === 1 || gameState === 3) {
						if (customAvatar) customAvatar.style.display = 'none';
						if (inGameHint) inGameHint.style.display = 'block';
						if (highScoreText) highScoreText.style.visibility = '';
						if (highScoreHeader) highScoreHeader.style.visibility = '';
					} else {
						// HIER IST DER FIX: In-Game-Score bei Game Over ausblenden!
						if (customAvatar) customAvatar.style.display = 'none';
						if (inGameHint) inGameHint.style.display = 'none';
						if (highScoreText) highScoreText.style.visibility = 'hidden';
						if (highScoreHeader) highScoreHeader.style.visibility = 'hidden';
					}
				}

				// Hilfe-Menü komplett auf Deutsch überschreiben
				if (helpBody && helpBody.innerHTML.includes('HOW TO PLAY')) {
					helpBody.innerHTML = `
						<h2 style="text-align: center; font-family: 'Exo 2', sans-serif; font-size: 24px; margin-bottom: 15px;">SPIELANLEITUNG</h2>
						<p>Das Ziel von <strong>Hexacore</strong> ist es zu verhindern, dass die Blöcke das äußere graue Sechseck verlassen.</p>
						<p>Tippe auf die linke oder rechte Bildschirmhälfte, um das Sechseck zu drehen.</p>
						<p>Sammle Punkte, indem du 3 oder mehr Blöcke der gleichen Farbe berühren lässt.</p>
						<div style="text-align: center; color: #e74c3c; font-weight: bold; font-size: 18px; margin-top: 25px; background: rgba(255,255,255,0.9); padding: 15px; border-radius: 8px; border: 2px solid #e74c3c;">
							GEOCACHING HINWEIS:<br>Erreiche 2500 Punkte, um die Final-Koordinaten zu entschlüsseln!
						</div>
					`;
				}

				// Koordinaten entschlüsseln
				if (typeof score !== 'undefined' && score >= 2500) {
					if (!window.cacheKnacked) {
						window.cacheKnacked = true;
						
						// Hier deinen Base64-String einfügen!
						var secretBase64 = "TiA1MSAxMi4zNDUgRSAwMDkgNTYuNzg5";
						
						alert("Glückwunsch! Du hast den Cache geknackt. Die Koordinaten sind: " + atob(secretBase64));
					}
				}
			}, 200);
		</script>
